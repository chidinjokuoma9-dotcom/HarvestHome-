<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b3b"><meta name="robots" content="index,follow">
<meta name="description" content="Read the latest reporting and insights from HarvestHome.">
<title>News Story | HarvestHome</title>
<link rel="canonical" href="https://harvesthome.ng/news-story.html">
<style>
:root{--green:#176b3b;--deep:#104b2b;--ink:#203329;--muted:#64736a;--line:#e4ebe5;--paper:#f5f8f4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:900px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{color:var(--deep);font-weight:850;text-decoration:none}.back{color:var(--green);font-weight:750;text-decoration:none}
main{max-width:820px;margin:34px auto;padding:0 20px 65px}.crumb{font-size:.9rem;color:var(--muted);margin-bottom:20px}.crumb a{color:var(--green);text-decoration:none;font-weight:700}
.story{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,48px);box-shadow:0 12px 32px rgba(22,65,39,.06)}
.tag{display:inline-block;background:#eef6ee;color:var(--green);padding:5px 11px;border-radius:999px;font-size:.78rem;font-weight:850}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.12;letter-spacing:-.035em;color:var(--deep);margin:17px 0}
.meta{color:var(--muted);font-size:.92rem;margin:0 0 25px}.summary{font-size:1.12rem;color:#465b4c;font-weight:550}
.cover{display:block;width:100%;max-height:430px;object-fit:cover;border-radius:13px;margin:24px 0}
.body-copy{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:28px}.body-copy p{margin:0 0 1.25em}
.story-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px}.story-actions button,.story-actions a{border:1px solid #d7e4d8;background:#f5faf5;color:var(--green);border-radius:9px;padding:9px 13px;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}.comments{margin-top:34px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,28px);box-shadow:0 8px 24px rgba(22,65,39,.04)}.comments h2{color:var(--deep);margin:0}.comments-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}.comment-form-wrap{margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}.comment-form-wrap h3{color:var(--deep);margin:0 0 12px}.comment-form-wrap label{display:block;font-weight:700;margin-bottom:7px}.comment-form-wrap textarea{display:block;width:100%;min-height:110px;border:1px solid #d5e1d6;border-radius:10px;padding:12px;font:inherit;resize:vertical}.comment-form-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}.comment-form-actions button,.comment-actions button{border:1px solid #d7e4d8;background:#f5faf5;color:var(--green);border-radius:9px;padding:8px 12px;font:inherit;font-weight:750;cursor:pointer}.comment-form-actions button[type=submit]{background:var(--green);color:#fff}.comment-form-actions button:disabled{opacity:.6}.comment-thread{margin:14px 0}.comment-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;margin-top:10px;overflow-wrap:anywhere}.comment-reply{margin-left:clamp(14px,4vw,38px);background:#f8fbf8}.comment-byline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.comment-byline time{font-size:.8rem;color:var(--muted)}.comment-card p{margin:8px 0}.comment-actions{display:flex;gap:8px}.comment-actions button{font-size:.82rem;padding:5px 9px}.related{margin-top:30px}.related h2{color:var(--deep)}.related-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.related-card{background:#f7faf7;border:1px solid var(--line);border-radius:12px;padding:14px}.related-card a{color:var(--green);font-weight:750;text-decoration:none}.related-card p{margin:5px 0 0;color:var(--muted);font-size:.9rem}@media(max-width:540px){.related-list{grid-template-columns:1fr}}.news-article-ad{max-width:820px;margin:0 auto 34px;padding:0 20px}.news-article-ad-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(22,65,39,.05)}.news-article-ad-label{display:inline-block;color:#76521e;background:#fff4df;border:1px solid #f0dfc6;border-radius:999px;padding:4px 9px;font-size:.72rem;font-weight:850;letter-spacing:.04em;text-transform:uppercase}.news-article-ad-card h2{font-size:1.2rem;line-height:1.3;color:var(--deep);margin:10px 0 6px}.news-article-ad-card p{color:var(--muted);margin:0 0 12px}.news-article-ad-card img{max-width:180px;max-height:100px;object-fit:contain;border-radius:10px;margin:12px 0}.news-article-ad-card a{color:var(--green);font-weight:800}
.source{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;color:var(--muted);font-size:.93rem}.source a{color:var(--green);font-weight:750}
.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:25px;color:var(--muted)}
footer{text-align:center;background:#103f27;color:#dce9df;padding:24px;font-size:.9rem}footer a{color:#fff;font-weight:700;text-decoration:none}
@media(max-width:540px){.nav{padding:12px 16px}main{margin-top:20px;padding:0 14px 45px}.story{border-radius:14px}}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="/news-insights.html">HarvestHome · News &amp; Insights</a><a class="back" href="/news-insights.html">← All stories</a></div></header>
<main><div class="crumb"><a href="/news-insights.html">News &amp; Insights</a> / Story</div>
<article id="story" class="story"><div class="notice">Loading story…</div></article>
</main>
<footer>© <span id="year"></span> HarvestHome · Connecting Africa. Growing Together. 🧡💚</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/Config.js?v=v10cachefix1"></script>
<script>
(() => {
"use strict";
document.getElementById("year").textContent=new Date().getFullYear();
const root=document.getElementById("story");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateText=v=>{if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});};
const safeUrl=v=>{try{const u=new URL(v);return ["https:","http:"].includes(u.protocol)?u.href:"";}catch{return "";}};
async function load(){
 try{
  const slug=new URLSearchParams(location.search).get("slug");
  if(!slug)throw new Error("This story link is incomplete.");
  if(!window.supabase||!window.HARVESTHOME_CONFIG)throw new Error("The newsroom is temporarily unavailable.");
  const client=window.supabase.createClient(HARVESTHOME_CONFIG.SUPABASE_URL,HARVESTHOME_CONFIG.SUPABASE_ANON_KEY);
  const {data,error}=await client.from("news_articles").select("title,slug,category,author_name,excerpt,content,featured_image_url,source_name,source_url,published_at").eq("slug",slug).eq("status","published").maybeSingle();
  if(error)throw error;
  if(!data)throw new Error("This story is unavailable or has not been published.");
  // Count at most one view per article per browser tab session.
  try{
   const visitorKey="hh_news_visitor_v1",sessionKey="hh_news_session_v1";
   let visitorId=localStorage.getItem(visitorKey),sessionId=sessionStorage.getItem(sessionKey);
   if(!visitorId){visitorId=crypto.randomUUID();localStorage.setItem(visitorKey,visitorId);}
   if(!sessionId){sessionId=crypto.randomUUID();sessionStorage.setItem(sessionKey,sessionId);}
   await client.rpc("record_news_article_view",{p_slug:data.slug,p_visitor_id:visitorId,p_session_id:sessionId});
  }catch(viewError){console.warn("News readership count unavailable:",viewError.message);}

  document.title=data.title+" | HarvestHome News & Insights";
  document.querySelector('meta[name="description"]').setAttribute("content",String(data.excerpt||"HarvestHome News & Insights").slice(0,300));
  document.querySelector('link[rel="canonical"]').setAttribute("href",location.origin+location.pathname+"?slug="+encodeURIComponent(data.slug));
  const source=safeUrl(data.source_url);
  const image=safeUrl(data.featured_image_url);
  const paragraphs=String(data.content||"").split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");
  const minutes=Math.max(1,Math.ceil(String(data.content||"").trim().split(/\s+/).filter(Boolean).length/200));
  root.innerHTML='<span class="tag">'+esc(data.category||"News")+'</span>'+
   '<h1>'+esc(data.title)+'</h1>'+
   '<p class="meta">By '+esc(data.author_name||"HarvestHome Editorial Team")+(data.published_at?" · "+esc(dateText(data.published_at)):"")+" · "+minutes+" min read"+'</p>'+
   '<p class="summary">'+esc(data.excerpt)+'</p>'+
   '<div class="story-actions"><button type="button" id="share-story">Share story</button><button type="button" id="share-picture-link">Share picture + link</button><a href="/news-insights.html">More stories</a></div>'+
   (image?'<img class="cover" src="'+esc(image)+'" alt="">':"")+
   '<div class="body-copy">'+paragraphs+'</div>'+
   (data.source_name?'<div class="source"><strong>Source / publisher:</strong> '+esc(data.source_name)+(source?' · <a href="'+esc(source)+'" target="_blank" rel="noopener noreferrer">View original source ↗</a>':"")+'</div>':(source?'<div class="source"><a href="'+esc(source)+'" target="_blank" rel="noopener noreferrer">View original source ↗</a></div>':""));
  try{
   const {data:ads,error:adsError}=await client.from("advertising_campaigns").select("id,business_name,headline,description,image_url,target_url").eq("placement","news_article").eq("status","approved").lte("starts_at",new Date().toISOString()).gt("ends_at",new Date().toISOString()).order("created_at",{ascending:false}).limit(1);
   if(!adsError&&ads&&ads.length){
    const ad=ads[0],image=safeUrl(ad.image_url),target=safeUrl(ad.target_url),section=document.createElement("section");section.className="news-article-ad";section.setAttribute("aria-label","Sponsored business");
    section.innerHTML='<div class="news-article-ad-card" data-ad-impression="'+esc(ad.id)+'">'+(image?'<img src="'+esc(image)+'" alt="'+esc(ad.business_name)+'" loading="lazy">':"")+'<span class="news-article-ad-label">Advertisement</span><h2>'+esc(ad.headline||ad.business_name)+'</h2><p>'+esc(ad.description||ad.business_name)+'</p>'+(target?'<a data-ad-click="'+esc(ad.id)+'" href="'+esc(target)+'" target="_blank" rel="noopener noreferrer">Learn more about this business →</a>':"")+'</div>';
    document.querySelector("main").appendChild(section);const key="hh_news_article_ad_seen_"+new Date().toISOString().slice(0,10);let seen=[];try{seen=JSON.parse(sessionStorage.getItem(key)||"[]")}catch{}
    if(!seen.includes(ad.id)){seen.push(ad.id);sessionStorage.setItem(key,JSON.stringify(seen));client.rpc("record_advertising_event",{p_campaign_id:ad.id,p_event_type:"impression"}).then(()=>{}).catch(()=>{});}
    section.addEventListener("click",event=>{const link=event.target.closest("[data-ad-click]");if(link)client.rpc("record_advertising_event",{p_campaign_id:link.dataset.adClick,p_event_type:"click"}).then(()=>{}).catch(()=>{});});
   }
  }catch(adError){console.warn("Article advertising is temporarily unavailable:",adError.message);}
  root.innerHTML+='<section class="related"><h2>Related stories</h2><div id="related-stories" class="related-list"><p class="meta">Finding related stories…</p></div></section>';
  document.getElementById("share-story").addEventListener("click",async()=>{const shareAuthor=data.author_name||"HarvestHome Editorial Team";const shareSummary=data.excerpt||data.title;const payload={title:data.title,text:"By "+shareAuthor+" — "+shareSummary,url:location.href};try{if(navigator.share)await navigator.share(payload);else if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(location.href);document.getElementById("share-story").textContent="Link copied";}else window.prompt("Copy this story link:",location.href);}catch(e){if(e.name!=="AbortError")window.prompt("Copy this story link:",location.href);}});
  document.getElementById("share-picture-link").addEventListener("click",async()=>{
   const button=document.getElementById("share-picture-link");
   const shareAuthor=data.author_name||"HarvestHome Editorial Team";
   const shareText="By "+shareAuthor+" — "+(data.excerpt||data.title);
   if(!image){window.alert("This story has no featured picture yet. Add a featured photo in News Admin, then publish or update the story.");return;}
   button.disabled=true;button.textContent="Preparing picture…";
   try{
    const response=await fetch(image,{mode:"cors"});
    if(!response.ok)throw new Error("The featured picture could not be downloaded.");
    const blob=await response.blob();
    const mime=blob.type||"image/jpeg";
    const ext=mime.includes("png")?"png":mime.includes("webp")?"webp":mime.includes("gif")?"gif":"jpg";
    const file=new File([blob],(data.slug||"harvesthome-story")+"."+ext,{type:mime});
    const payload={files:[file],title:data.title,text:shareText+"\n"+location.href,url:location.href};
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
     await navigator.share(payload);
    }else{
     const objectUrl=URL.createObjectURL(blob);
     const a=document.createElement("a");a.href=objectUrl;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
     const message=data.title+"\n"+shareText+"\n"+location.href;
     if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(message);}
     window.alert("The picture has been downloaded and the story link/message copied. Open your social app, attach the downloaded picture, and paste the link. Where supported, social platforms will also generate a picture preview from the link.");
     setTimeout(()=>URL.revokeObjectURL(objectUrl),60000);
    }
   }catch(error){
    if(error.name!=="AbortError"){
     window.alert("Could not prepare the picture for sharing. You can still share the story link; its social preview uses the featured picture when the platform supports link previews.");
    }
   }finally{button.disabled=false;button.textContent="Share picture + link";}
  });
  root.innerHTML+='<section class="comments" id="article-comments" aria-labelledby="comments-title"><div class="comments-head"><div><h2 id="comments-title">Reader comments</h2><p class="meta">Join a respectful discussion. Comments appear publicly only after newsroom approval.</p></div><span id="comments-count" class="tag">Loading…</span></div><div id="comments-list" aria-live="polite"><p class="meta">Loading comments…</p></div><div class="comment-form-wrap"><h3>Join the conversation</h3><div id="comment-signin" class="meta" hidden><a href="/">Sign in to your HarvestHome account</a> to leave a comment or reply.</div><form id="comment-form" hidden><label for="comment-text">Your comment</label><textarea id="comment-text" minlength="2" maxlength="2000" rows="4" required placeholder="Share a relevant, respectful thought…"></textarea><div class="comment-form-actions"><span id="replying-to" class="meta"></span><button type="button" id="cancel-reply" hidden>Cancel reply</button><button type="submit" id="submit-comment">Submit comment</button></div><p id="comment-message" class="meta" role="status"></p></form></div></section>';
  const commentForm=document.getElementById("comment-form"),commentList=document.getElementById("comments-list"),commentMessage=document.getElementById("comment-message");
  let commentUser=null,replyTo=null;
  const commentDate=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"});};
  function setReply(id,name){replyTo=id;document.getElementById("replying-to").textContent="Replying to "+name;document.getElementById("cancel-reply").hidden=false;document.getElementById("comment-text").focus();}
  function clearReply(){replyTo=null;document.getElementById("replying-to").textContent="";document.getElementById("cancel-reply").hidden=true;}
  async function loadArticleComments(){
    try{
      const [{data:sessionData},{data,error}]=await Promise.all([client.auth.getSession(),client.rpc("get_news_article_comments",{p_slug:data.slug})]);
      if(error)throw error;
      commentUser=sessionData?.session?.user||null;
      commentForm.hidden=!commentUser;
      document.getElementById("comment-signin").hidden=!!commentUser;
      const rows=Array.isArray(data)?data:[];
      document.getElementById("comments-count").textContent=rows.length+" approved";
      if(!rows.length){commentList.innerHTML='<p class="meta">No comments yet. Be the first to start a thoughtful discussion.</p>';return;}
      const roots=rows.filter(r=>!r.parent_id),children=new Map();
      rows.filter(r=>r.parent_id).forEach(r=>{if(!children.has(r.parent_id))children.set(r.parent_id,[]);children.get(r.parent_id).push(r);});
      const actions=(r)=>commentUser?'<div class="comment-actions"><button type="button" data-comment-reply="'+esc(r.id)+'" data-comment-author="'+esc(r.author_name)+'">Reply</button><button type="button" data-comment-report="'+esc(r.id)+'">Report</button></div>':"";
      const renderComment=(r,isReply=false)=>'<article class="comment-card'+(isReply?' comment-reply':'')+'"><div class="comment-byline"><strong>'+esc(r.author_name||"HarvestHome reader")+'</strong><time>'+esc(commentDate(r.created_at))+'</time></div><p>'+esc(r.comment).replace(/\n/g,"<br>")+'</p>'+actions(r)+'</article>';
      commentList.innerHTML=roots.map(r=>'<div class="comment-thread">'+renderComment(r)+(children.get(r.id)||[]).map(reply=>renderComment(reply,true)).join("")+'</div>').join("");
    }catch(err){commentList.innerHTML='<p class="meta">Comments are temporarily unavailable. Please try again later.</p>';document.getElementById("comments-count").textContent="Unavailable";console.warn("News comments unavailable:",err.message);}
  }
  commentList.addEventListener("click",async event=>{
    const reply=event.target.closest("[data-comment-reply]");
    if(reply){setReply(reply.dataset.commentReply,reply.dataset.commentAuthor||"reader");return;}
    const report=event.target.closest("[data-comment-report]");
    if(report){const reason=window.prompt("Why are you reporting this comment? Please provide a brief reason.");if(!reason)return;try{const {error}=await client.rpc("report_news_article_comment",{p_comment_id:report.dataset.commentReport,p_reason:reason.trim()});if(error)throw error;window.alert("Thank you. The newsroom has received your report.");}catch(err){window.alert(err.message||"The report could not be submitted.");}}
  });
  document.getElementById("cancel-reply").addEventListener("click",clearReply);
  commentForm.addEventListener("submit",async event=>{
    event.preventDefault();const button=document.getElementById("submit-comment"),value=document.getElementById("comment-text").value.trim();if(!value)return;
    button.disabled=true;commentMessage.textContent="Submitting for moderator approval…";
    try{const {error}=await client.rpc("submit_news_article_comment",{p_slug:data.slug,p_comment:value,p_parent_id:replyTo});if(error)throw error;commentForm.reset();clearReply();commentMessage.textContent="Thank you. Your comment has been submitted and will appear after moderator approval.";}
    catch(err){commentMessage.textContent=err.message||"Your comment could not be submitted.";console.warn("News comment submission failed:",err.message);}
    finally{button.disabled=false;}
  });
  await loadArticleComments();
  const related=await client.from("news_articles").select("title,slug,excerpt,category").eq("status","published").eq("category",data.category).neq("slug",data.slug).order("published_at",{ascending:false}).limit(4);
  const relatedEl=document.getElementById("related-stories");
  if(!related.error&&related.data&&related.data.length){relatedEl.innerHTML=related.data.map(a=>'<article class="related-card"><span class="tag">'+esc(a.category||"News")+'</span><h3><a href="/news-story.html?slug='+encodeURIComponent(a.slug)+'">'+esc(a.title)+'</a></h3><p>'+esc(a.excerpt||"Read this related story.")+'</p></article>').join("");}
  else{relatedEl.innerHTML='<p class="meta">More stories in this topic will appear here as the newsroom publishes them.</p>';}

 }catch(error){root.innerHTML='<div class="notice"><h1>Story unavailable</h1><p>'+esc(error.message||"We could not load this story.")+'</p><a class="back" href="/news-insights.html">Return to News &amp; Insights</a></div>';}
}
load();
})();
</script>
</body></html>
