name: Validate MELE DATA development preview

on:
  push:
    branches:
      - feature/harvesthome-data-airtime-foundation
    paths:
      - "data-airtime-test.html"
      - "airtime-test.html"
      - "vtu-test.html"
      - "Config.js"
      - "supabase/functions/meledata-test-catalog/index.ts"
      - ".github/workflows/validate-meledata-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check diagnostic pages and test-only safety guards
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          page = Path("data-airtime-test.html").read_text(encoding="utf-8")
          fn = Path("supabase/functions/meledata-test-catalog/index.ts").read_text(encoding="utf-8")

          required_page = [
              'name="robots" content="noindex,nofollow,noarchive"',
              'persistSession: false',
              'functions.invoke("meledata-test-catalog"',
              'method: "GET"',
          ]
          for item in required_page:
              if item not in page:
                  raise SystemExit(f"Preview page missing safety requirement: {item}")

          if 'Authorization: "Bearer " + accessToken' not in page:
              raise SystemExit("Expected authenticated test-catalog request is missing.")

          if "MELEDATA_API_KEY" not in fn:
              raise SystemExit("Server-side MELE DATA key handling is missing.")
          if 'req.method !== "GET"' not in fn:
              raise SystemExit("Function must reject non-GET methods.")
          if "if (!isTest" not in fn or "purchases_enabled: false" not in fn:
              raise SystemExit("Test-mode or purchases-disabled guard is missing.")
          if "/data/plans" not in fn or "/wallet/" not in fn:
              raise SystemExit("Expected test wallet/catalog checks are missing.")

          scripts = re.findall(r"<script>([\s\S]*?)</script>", page, re.IGNORECASE)
          if not scripts:
              raise SystemExit("No inline JavaScript was found in the diagnostic page.")

          with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
              f.write("\n".join(scripts))
              js_path = f.name
          subprocess.run(["node", "--check", js_path], check=True)

          airtime_page = Path("airtime-test.html").read_text(encoding="utf-8")
          config = Path("Config.js").read_text(encoding="utf-8")
          required_airtime = [
              'name="robots" content="noindex,nofollow,noarchive"',
              '<script src="Config.js?v=airtime-test-config1"></script>',
              "config.SUPABASE_URL",
              "config.SUPABASE_ANON_KEY",
              'functions.invoke("meledata-test-airtime"',
              'method:"POST"',
          ]
          for item in required_airtime:
              if item not in airtime_page:
                  raise SystemExit(f"Airtime test page missing requirement: {item}")
          if "SUPABASE_URL:" not in config or "SUPABASE_ANON_KEY:" not in config:
              raise SystemExit("Shared HarvestHome Supabase configuration is incomplete.")
          if "paystack.initialize" in airtime_page.lower() or "purchases_enabled = true" in airtime_page.lower():
              raise SystemExit("Airtime test page must not enable live checkout or purchases.")

          airtime_scripts = re.findall(r"<script>([\s\S]*?)</script>", airtime_page, re.IGNORECASE)
          if not airtime_scripts:
              raise SystemExit("No inline JavaScript was found in the airtime test page.")
          with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
              f.write("\n".join(airtime_scripts))
              airtime_js_path = f.name
          subprocess.run(["node", "--check", airtime_js_path], check=True)

          hub = Path("vtu-test.html").read_text(encoding="utf-8")
          for item in [
              'name="robots" content="noindex,nofollow,noarchive"',
              'href="/airtime-test.html"',
              'href="/"',
              "No customer checkout or live purchase is available here",
          ]:
              if item not in hub:
                  raise SystemExit(f"VTU hub missing safety/navigation requirement: {item}")

          print("Catalog, airtime and VTU hub checks passed. No production deployment or purchase was performed.")
