name: Deploy HarvestHome private News & Insights preview

on:
  push:
    branches:
      - feature/news-insights-private-preview

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy isolated HarvestHome preview Worker
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v6

      - name: Deploy preview Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.news-preview.jsonc
