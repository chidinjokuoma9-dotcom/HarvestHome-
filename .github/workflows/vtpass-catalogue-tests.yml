name: VTpass Catalogue and Transaction Safety Tests

on:
  push:
    branches:
      - feature/harvesthome-data-airtime-foundation
    paths:
      - "scripts/vtpass-catalogue-utils.mjs"
      - "scripts/vtpass-catalogue-utils.test.mjs"
      - "scripts/vtpass-transaction-utils.mjs"
      - "scripts/vtpass-transaction-utils.test.mjs"
      - "scripts/vtu-order-state.mjs"
      - "scripts/vtu-order-state.test.mjs"
      - "scripts/vtu-transaction-state.mjs"
      - "scripts/vtu-transaction-state.test.mjs"
      - "scripts/vtu-order-schema-draft.test.mjs"
      - "scripts/vtu-paystack-verification.mjs"
      - "scripts/vtu-paystack-verification.test.mjs"
      - "scripts/vtu-edge-handler-safety.test.mjs"
      - "supabase/functions/vtu-paystack-initialize/index.ts"
      - "supabase/functions/vtu-paystack-verify/index.ts"
      - "docs/VTU-ORDER-SCHEMA-DRAFT.sql"
      - ".github/workflows/vtpass-catalogue-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue-helper-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline catalogue helper tests
        run: node --test scripts/vtpass-catalogue-utils.test.mjs
      - name: Run transaction outcome safety tests
        run: node --test scripts/vtpass-transaction-utils.test.mjs
      - name: Run VTU order-state safety tests
        run: node --test scripts/vtu-order-state.test.mjs
      - name: Run VTU transaction lifecycle safety tests
        run: node --test scripts/vtu-transaction-state.test.mjs
      - name: Check review-only VTU schema draft safety
        run: node --test scripts/vtu-order-schema-draft.test.mjs
      - name: Run strict VTU Paystack verification tests
        run: node --test scripts/vtu-paystack-verification.test.mjs
      - name: Check isolated VTU Edge Function safeguards
        run: node --test scripts/vtu-edge-handler-safety.test.mjs
