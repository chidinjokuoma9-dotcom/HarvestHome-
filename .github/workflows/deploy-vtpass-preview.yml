name: Deploy isolated HarvestHome VTpass test site

on:
  push:
    branches:
      - feature/harvesthome-data-airtime-foundation
    paths:
      - "vtpass-data-test.html"
      - "vtpass-airtime-test.html"
      - "vtu-test.html"
      - "vtu-shop-preview.html"
      - "wallet-preview.html"
      - "Config.js"
      - "wrangler.vtpass-preview.toml"
      - ".github/workflows/deploy-vtpass-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development branch only
        uses: actions/checkout@v4

      - name: Prepare isolated VTpass-only test pages
        run: |
          mkdir -p .vtpass-preview
          cp vtpass-data-test.html .vtpass-preview/index.html
          cp vtpass-data-test.html .vtpass-preview/vtpass-data-test.html
          cp vtpass-airtime-test.html .vtpass-preview/vtpass-airtime-test.html
          cp vtu-test.html .vtpass-preview/vtu.html
          cp vtu-shop-preview.html .vtpass-preview/shop.html
          cp wallet-preview.html .vtpass-preview/wallet-preview.html
          cp Config.js .vtpass-preview/Config.js

      - name: Deploy dedicated Cloudflare Worker test site (not production)
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: deploy --config wrangler.vtpass-preview.toml --name vtpass-test-harvesthome --message "HarvestHome VTpass-only isolated test site"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish preview link in workflow summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
        run: |
          {
            echo "## HarvestHome VTpass-only isolated test site"
            echo
            echo "Dedicated development Worker only. Production Worker and harvesthome.ng are not deployed."
            echo
            echo "- **Test URL:** ${PREVIEW_URL}"
            echo "- **VTU hub:** ${PREVIEW_URL}/vtu.html"
            echo "- **Customer shop preview (no checkout):** ${PREVIEW_URL}/shop.html"
            echo "- **Data review:** ${PREVIEW_URL}/vtpass-data-test.html"
            echo "- **Airtime test:** ${PREVIEW_URL}/vtpass-airtime-test.html"
            echo "- **Specific deployment:** ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
