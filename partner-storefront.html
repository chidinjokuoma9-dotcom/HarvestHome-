<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b3b"><meta name="description" content="Explore an official HarvestHome partner business and its marketplace listings."><meta name="robots" content="index,follow"><title>Partner Storefront | HarvestHome</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f4;color:#183326;font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 16px 54px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;color:#176b3b;text-decoration:none;font-size:19px}.top a:last-child{color:#176b3b;font-weight:750;text-decoration:none}.hero{margin-top:16px;position:relative;min-height:240px;border-radius:26px;overflow:hidden;background:linear-gradient(120deg,#123d29,#176b3b 58%,#26884d);background-position:center;background-size:cover;color:#fff}.shade{min-height:240px;padding:clamp(22px,5vw,48px);display:flex;align-items:end;background:linear-gradient(90deg,#092c1fe8,#0c3925b8 55%,#0c392533)}.identity{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.logo{width:90px;height:90px;border:4px solid #fff;border-radius:22px;object-fit:cover;background:#fff}.logo-fallback{display:grid;place-items:center;font-size:38px;color:#176b3b}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 11px;background:#e7f8ed;color:#176b3b;font-size:12px;font-weight:900}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:13px 0 5px}.hero p{margin:0;color:#e2f1e5;max-width:720px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-flex;padding:11px 15px;border-radius:11px;background:#fff;color:#155632;text-decoration:none;font-weight:850}.btn.alt{background:#ffffff18;color:#fff;border:1px solid #ffffff80}.info{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin:18px 0 30px}.panel{background:#fff;border:1px solid #e1e9e1;border-radius:18px;padding:20px}.panel h2{margin:0 0 10px;color:#174e2e}.muted{color:#68756b}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.stat{background:#f1f7f1;border-radius:12px;padding:10px 13px;color:#31513c}.stat b{display:block;font-size:18px;color:#176b3b}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:26px 0 14px}.section-head h2{margin:0;color:#174e2e;font-size:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}.listing{background:#fff;border:1px solid #e1e9e1;border-radius:17px;overflow:hidden}.photo{height:205px;background:#edf3ed;display:grid;place-items:center;font-size:44px;color:#7d9481}.photo img{width:100%;height:100%;object-fit:cover}.listing-body{padding:15px}.pill{display:inline-block;background:#eef5ee;color:#176b3b;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.listing h3{margin:8px 0 4px;font-size:18px;color:#183b29}.price{font-weight:900;font-size:18px;color:#176b3b;margin:8px 0}.location{font-size:13px;color:#69766c}.desc{color:#58685d;font-size:13px}.view{display:flex;justify-content:space-between;border-top:1px solid #edf1ed;padding-top:12px;margin-top:12px;text-decoration:none;color:#176b3b;font-weight:850}.empty{padding:28px;text-align:center;background:#fff;border:1px dashed #cbdacb;border-radius:16px;color:#68756b}.foot{text-align:center;color:#6b786e;font-size:12px;margin-top:30px}.foot a{color:#176b3b;font-weight:700}@media(max-width:720px){.info{grid-template-columns:1fr}.hero,.shade{min-height:260px}.section-head{display:block}.section-head h2{font-size:23px}}
</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/">🌿 HarvestHome</a><a href="/partners.html">← All partners</a></div><div id="page"><div class="empty" style="margin-top:18px">Loading partner storefront…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/Config.js?v=partnerstorefront1"></script>
<script>
(function(){
 const root=document.getElementById('page'),params=new URLSearchParams(location.search),slug=params.get('slug')||'';
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const safeUrl=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
 const money=(n,c)=>{try{return new Intl.NumberFormat('en',{style:'currency',currency:c||'NGN',maximumFractionDigits:0}).format(Number(n||0))}catch{return (c||'NGN')+' '+Number(n||0).toLocaleString()}};
 function unavailable(){root.innerHTML='<div class="empty" style="margin-top:18px"><h2>Storefront unavailable</h2><p>This partner profile is not published or could not be found.</p><a href="/partners.html">Browse official partners</a> · <a href="/">Browse marketplace</a></div>'}
 async function load(){
  const c=window.HARVESTHOME_CONFIG;
  if(!slug||!window.supabase||!c?.SUPABASE_URL||!c?.SUPABASE_ANON_KEY){unavailable();return}
  const db=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);
  try{
   const {data:p,error}=await db.from('partner_storefronts').select('*').eq('slug',slug).eq('is_published',true).maybeSingle();
   if(error)throw error;if(!p){unavailable();return}
   const {data:rows,error:listingError}=await db.from('listings').select('id,title,description,price,currency,category,mode,country,location,cover_url,video_url,publication_plan,publish_expires_at,created_at').eq('seller_id',p.seller_id).eq('status','approved').order('created_at',{ascending:false}).limit(60);
   if(listingError)throw listingError;
   const now=Date.now(),listings=(rows||[]).filter(l=>String(l.publication_plan||'').toLowerCase()!=='free'||!l.publish_expires_at||new Date(l.publish_expires_at).getTime()>now);
   let mediaBy={};
   if(listings.length){const m=await db.from('listing_media').select('listing_id,media_type,storage_path').in('listing_id',listings.map(x=>x.id));if(!m.error)(m.data||[]).forEach(x=>{if(x.media_type==='image'&&!mediaBy[x.listing_id])mediaBy[x.listing_id]=db.storage.from('listing-media').getPublicUrl(x.storage_path).data.publicUrl})}
   const cover=safeUrl(p.cover_url),logo=safeUrl(p.logo_url),website=safeUrl(p.website);
   document.title=p.business_name+' | Official HarvestHome Partner';
   const desc=(p.description||'').slice(0,155)||'Explore this approved HarvestHome partner business and its current marketplace listings.';
   document.querySelector('meta[name="description"]').setAttribute('content',desc);
   const canonical=document.querySelector('link[rel="canonical"]')||document.head.appendChild(Object.assign(document.createElement('link'),{rel:'canonical'}));
   canonical.href=location.origin+location.pathname+'?slug='+encodeURIComponent(p.slug);
   root.innerHTML='<section class="hero" style="'+(cover?'background-image:url(&quot;'+esc(cover)+'&quot;)':'')+'"><div class="shade"><div><div class="identity">'+(logo?'<img class="logo" src="'+esc(logo)+'" alt="'+esc(p.business_name)+' logo">':'<div class="logo logo-fallback">🌿</div>')+'<span class="badge">✓ Official HarvestHome Partner</span></div><h1>'+esc(p.business_name)+'</h1><p>'+esc(p.tagline||'A business partner on HarvestHome')+'</p><div class="actions"><a class="btn" href="#partner-listings">Explore listings ↓</a>'+(website?'<a class="btn alt" href="'+esc(website)+'" target="_blank" rel="noopener noreferrer">Visit business website ↗</a>':'')+'</div></div></div></section><section class="info"><article class="panel"><h2>About this business</h2><p>'+esc(p.description||'This business is an approved HarvestHome partner.')+'</p><p class="muted">Partner location: '+esc(p.country||'Not specified')+'</p></article><aside class="panel"><h2>Connect</h2><p class="muted">Contact the business using the details it has provided. Confirm all terms and availability directly.</p>'+(p.phone?'<p>☎ '+esc(p.phone)+'</p>':'')+(p.website?'<p><a href="'+esc(website)+'" target="_blank" rel="noopener noreferrer">Business website ↗</a></p>':'')+'<div class="stats"><div class="stat"><b>'+listings.length+'</b>Active listings</div><div class="stat"><b>✓</b>Partner approved</div></div></aside></section><div class="section-head" id="partner-listings"><div><span class="badge">Marketplace inventory</span><h2>Available listings</h2><p class="muted">These listings also appear in the main HarvestHome marketplace and its regular search and categories.</p></div><span class="muted">'+listings.length+' active</span></div><div class="grid">'+(listings.length?listings.map(l=>'<article class="listing"><div class="photo">'+(safeUrl(mediaBy[l.id]||l.cover_url)?'<img src="'+esc(safeUrl(mediaBy[l.id]||l.cover_url))+'" alt="'+esc(l.title)+'" loading="lazy">':'📦')+'</div><div class="listing-body"><span class="pill">'+esc(l.category)+' · '+esc(l.mode)+'</span><h3>'+esc(l.title)+'</h3><p class="location">📍 '+esc(l.location||'Location not specified')+' · '+esc(l.country||p.country)+'</p><div class="price">'+money(l.price,l.currency)+'</div><p class="desc">'+esc((l.description||'').slice(0,150))+'</p><a class="view" href="/?shared=listing&listing='+encodeURIComponent(l.id)+'">View marketplace listing <span>→</span></a></div></article>').join(''):'<div class="empty" style="grid-column:1/-1">This partner has no active approved listings at the moment. Check back later.</div>')+'</div>';
  }catch(e){console.warn('Partner storefront load failed:',e);unavailable()}
 }
 load();
})();
</script></body></html>
