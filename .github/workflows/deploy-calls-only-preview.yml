name: Deploy HarvestHome calls-only preview

on:
  push:
    branches:
      - feature/harvesthome-calls-only

permissions:
  contents: read

jobs:
  deploy-calls-only-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy isolated calls-only Worker
    steps:
      - name: Check out isolated calls-only branch
        uses: actions/checkout@v6

      - name: Deploy separate Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.calls-only-test.jsonc
