name: Deploy HarvestHome call-test preview

on:
  push:
    branches:
      - feature/harvesthome-voice-video-calls

permissions:
  contents: read

jobs:
  deploy-call-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy isolated call-test Worker
    steps:
      - name: Check out call-testing branch
        uses: actions/checkout@v6

      - name: Deploy separate Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.call-test.jsonc
