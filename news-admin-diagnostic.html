<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HarvestHome News Desk Diagnostic</title><style>body{font:16px system-ui;max-width:720px;margin:30px auto;padding:0 16px;color:#183b29}input,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}button{background:#176b3b;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;background:#f3f7f3;padding:14px;border-radius:8px;overflow-wrap:anywhere}.note{background:#fff6e8;padding:12px;border-radius:8px}</style></head>
<body><h1>HarvestHome News Desk — Private Diagnostic</h1><p class="note">Read-only test. This page will not publish, edit, or delete any story.</p><form id="f"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="go">Sign in and test article access</button></form><pre id="out">Waiting for sign-in.</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/Config.js?diagnostic=20261102"></script><script>
const out=document.getElementById("out"),btn=document.getElementById("go");
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;out.textContent="Checking configuration…";try{if(!window.supabase||!window.HARVESTHOME_CONFIG)throw Error("Supabase library or Config.js did not load.");const c=window.supabase.createClient(HARVESTHOME_CONFIG.SUPABASE_URL,HARVESTHOME_CONFIG.SUPABASE_ANON_KEY);out.textContent="Signing in…";const {data:auth,error:ae}=await c.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(ae)throw ae;out.textContent="Signed in. Checking Admin profile…";const {data:profile,error:pe}=await c.from("profiles").select("role").eq("id",auth.user.id).maybeSingle();if(pe)throw pe;out.textContent="Profile role: "+(profile?.role||"not found")+". Requesting News articles…";const {data,error}=await c.from("news_articles").select("id,title,status,created_at").order("created_at",{ascending:false}).limit(20);if(error)throw error;out.textContent="SUCCESS — "+data.length+" article row(s) visible to this signed-in account.\n\n"+JSON.stringify(data,null,2);await c.auth.signOut();}catch(err){out.textContent="DIAGNOSTIC ERROR\n"+(err.message||String(err))+"\n\nNo stories were changed."; }finally{btn.disabled=false;}});
</script></body></html>
