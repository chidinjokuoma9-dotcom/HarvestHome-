name: Deploy isolated MELE DATA test preview

on:
  push:
    branches:
      - feature/harvesthome-data-airtime-foundation
    paths:
      - "data-airtime-test.html"
      - "airtime-test.html"
      - "Config.js"
      - "wrangler.meledata-preview.toml"
      - ".github/workflows/deploy-meledata-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development branch only
        uses: actions/checkout@v4

      - name: Prepare the isolated test page
        run: |
          mkdir -p .meledata-preview
          cp data-airtime-test.html .meledata-preview/index.html
          cp airtime-test.html .meledata-preview/airtime-test.html
          cp Config.js .meledata-preview/Config.js

      - name: Create Cloudflare Worker Preview (not production)
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: preview --config wrangler.meledata-preview.toml --name meledata-test --message "MELE DATA catalog test page"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish preview link in workflow summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
        run: |
          {
            echo "## HarvestHome MELE DATA test preview"
            echo
            echo "This is a Cloudflare Worker Preview. The production Worker was not deployed."
            echo
            echo "- **Preview URL:** ${PREVIEW_URL}"
            echo "- **Specific deployment:** ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
