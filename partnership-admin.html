<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#176b3b"><title>Partnership Review | HarvestHome</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f4;color:#183326;font:15px/1.55 system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px 16px 48px}.brand{color:#176b3b;font-weight:900;text-decoration:none}.panel{background:white;border:1px solid #dfe8df;border-radius:15px;padding:20px;margin-top:18px}h1,h2{color:#174e2e}label{display:block;margin:12px 0 5px;font-weight:650}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd9cc;border-radius:8px;font:inherit}button,.btn{border:0;border-radius:9px;background:#176b3b;color:white;padding:11px 15px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.55;cursor:wait}.secondary{background:#edf5ed;color:#176b3b;border:1px solid #cbd9cc}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#5e6d62}.notice{padding:12px;background:#eef6ee;border-radius:8px;white-space:pre-wrap}.application{border:1px solid #e0e9e0;border-radius:12px;padding:16px;margin:12px 0}.application h3{margin:0 0 8px}.tag{font-size:12px;font-weight:800;text-transform:uppercase;color:#176b3b}.details{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}@media(min-width:800px){.layout{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}.layout .panel{margin-top:18px}}
</style></head><body><main class="wrap">
<a class="brand" href="/">🌿 HarvestHome</a>
<h1>Partnership application review</h1><p class="muted">Private staff page. Sign in with your existing HarvestHome administrator or moderator account. Database permissions decide whether you can view or review applications.</p>
<section class="panel" id="login-panel"><h2>Staff sign in</h2><form id="login-form"><label for="email">Account email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" id="login-button" style="margin-top:14px">Sign in</button></form><p id="login-message" class="notice" role="status"></p></section>
<div id="dashboard" hidden><div class="layout"><section class="panel"><h2>Applications</h2><p id="staff-email" class="muted"></p><label for="filter">Filter status</label><select id="filter"><option value="all">All applications</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="declined">Declined</option></select><button id="refresh" class="secondary" style="margin-top:12px">Refresh list</button><button id="logout" class="secondary" style="margin-top:12px">Sign out</button><p id="list-message" class="notice" role="status"></p></section><section class="panel"><h2>Submitted enquiries</h2><div id="applications"></div></section></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/Config.js?v=v10cachefix1"></script><script>
(function(){
 const $=id=>document.getElementById(id);let client=null,rows=[];
 const statusText=s=>s==='approved'?'Approved':s==='declined'?'Declined':'Pending';
 function message(id,text){$(id).textContent=text||''}
 function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function safeWebsite(v){try{const u=new URL(String(v));return (u.protocol==='https:'||u.protocol==='http:')?u.href:''}catch(e){return ''}}
 function showDashboard(email){$('login-panel').hidden=true;$('dashboard').hidden=false;$('staff-email').textContent='Signed in as '+email;load()}
 async function init(){
  if(!window.supabase||!window.HARVESTHOME_CONFIG){message('login-message','The dashboard could not load its configuration. Please contact the site administrator.');return}
  client=window.supabase.createClient(HARVESTHOME_CONFIG.SUPABASE_URL,HARVESTHOME_CONFIG.SUPABASE_ANON_KEY);
  const {data:{session}}=await client.auth.getSession();
  if(session) {showDashboard(session.user.email||'Staff account');}
 }
 $('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-button').disabled=true;message('login-message','Signing in…');try{const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;showDashboard(data.user.email||'Staff account');message('login-message','')}catch(err){message('login-message','Sign-in failed. Check your credentials and try again. If your account is not authorised, it will not be able to view applications.')}finally{$('login-button').disabled=false}});
 async function load(){message('list-message','Loading applications…');$('applications').innerHTML='';const {data,error}=await client.from('partnership_applications').select('*').order('created_at',{ascending:false}).limit(200);if(error){rows=[];message('list-message','Could not load applications. Your account may not have authorised Admin/Moderator access. Database access is restricted.');return}rows=data||[];render();message('list-message',rows.length+' application(s) loaded.')}
 function render(){const filter=$('filter').value;const shown=rows.filter(r=>filter==='all'||r.status===filter);$('applications').innerHTML=shown.length?shown.map(r=>'<article class="application" data-id="'+escapeHtml(r.id)+'"><div class="tag">'+escapeHtml(statusText(r.status))+' · '+escapeHtml(r.partnership_type)+'</div><h3>'+escapeHtml(r.organisation_name)+'</h3><p><strong>Contact:</strong> '+escapeHtml(r.contact_name)+'<br><strong>Email:</strong> <a href="mailto:'+escapeHtml(r.email)+'">'+escapeHtml(r.email)+'</a><br><strong>Phone:</strong> '+escapeHtml(r.phone||'Not provided')+'<br><strong>Location:</strong> '+escapeHtml(r.country)+'<br><strong>Website:</strong> '+(safeWebsite(r.website)?'<a rel="noopener noreferrer" target="_blank" href="'+escapeHtml(safeWebsite(r.website))+'">'+escapeHtml(r.website)+'</a>':'Not provided')+'<br><strong>Submitted:</strong> '+escapeHtml(new Date(r.created_at).toLocaleString())+'</p><h4>Proposal</h4><div class="details">'+escapeHtml(r.proposal)+'</div><label>Internal review note</label><textarea class="admin-note" maxlength="2000" rows="3">'+escapeHtml(r.admin_note||'')+'</textarea><label>Decision</label><select class="admin-status"><option value="pending" '+(r.status==='pending'?'selected':'')+'>Pending</option><option value="approved" '+(r.status==='approved'?'selected':'')+'>Approved</option><option value="declined" '+(r.status==='declined'?'selected':'')+'>Declined</option></select><div class="actions"><button data-save="'+escapeHtml(r.id)+'">Save review</button><button class="secondary" data-email="'+escapeHtml(r.id)+'">Email applicant</button></div><p class="muted" role="status"></p></article>').join(''):'<p class="muted">No applications in this filter.</p>'}
 $('applications').addEventListener('click',async e=>{const save=e.target.closest('[data-save]');const mail=e.target.closest('[data-email]');if(mail){const r=rows.find(x=>x.id===mail.dataset.email);if(r)location.href='mailto:'+encodeURIComponent(r.email)+'?subject='+encodeURIComponent('HarvestHome partnership enquiry follow-up')+'&body='+encodeURIComponent('Hello '+r.contact_name+',\n\nThank you for contacting HarvestHome about '+r.partnership_type+'.\n\n');return}if(!save)return;const card=save.closest('.application'),id=save.dataset.save;const status=card.querySelector('.admin-status').value,note=card.querySelector('.admin-note').value.trim(),out=card.querySelector('[role=status]');save.disabled=true;out.textContent='Saving…';try{const {data:{user}}=await client.auth.getUser();const {error}=await client.from('partnership_applications').update({status,admin_note:note,reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)throw error;out.textContent='Review saved.';await load()}catch(err){out.textContent='Could not save review. Confirm your staff permissions and try again.'}finally{save.disabled=false}});
 $('refresh').addEventListener('click',load);$('filter').addEventListener('change',render);$('logout').addEventListener('click',async()=>{await client.auth.signOut();$('dashboard').hidden=true;$('login-panel').hidden=false;message('login-message','You have signed out.')});
 init();
})();
</script></body></html>
