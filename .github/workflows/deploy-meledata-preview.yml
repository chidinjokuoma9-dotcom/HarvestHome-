name: Deploy isolated HarvestHome VTU test site

on:
  push:
    branches:
      - feature/harvesthome-data-airtime-foundation
    paths:
      - "data-airtime-test.html"
      - "vtpass-data-test.html"
      - "vtpass-airtime-test.html"
      - "airtime-test.html"
      - "vtu-test.html"
      - "vtu-shop-preview.html"
      - "wallet-preview.html"
      - "Config.js"
      - "wrangler.meledata-preview.toml"
      - ".github/workflows/deploy-meledata-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development branch only
        uses: actions/checkout@v4

      - name: Prepare the isolated test pages
        run: |
          mkdir -p .meledata-preview
          cp data-airtime-test.html .meledata-preview/index.html
          cp vtpass-data-test.html .meledata-preview/vtpass-data-test.html
          cp vtpass-airtime-test.html .meledata-preview/vtpass-airtime-test.html
          cp airtime-test.html .meledata-preview/airtime-test.html
          cp vtu-test.html .meledata-preview/vtu.html
          cp vtu-shop-preview.html .meledata-preview/shop.html
          cp wallet-preview.html .meledata-preview/wallet-preview.html
          cp Config.js .meledata-preview/Config.js

      - name: Deploy dedicated Cloudflare Worker test site (not production)
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: deploy --config wrangler.meledata-preview.toml --name meledata-test-harvesthome --message "HarvestHome VTU isolated test site"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish preview link in workflow summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
        run: |
          {
            echo "## HarvestHome VTU isolated test site"
            echo
            echo "This is a dedicated test Worker at a stable workers.dev address. The production Worker and harvesthome.ng were not deployed."
            echo
            echo "- **Test URL:** ${PREVIEW_URL}"
            echo "- **VTU hub:** ${PREVIEW_URL}/vtu.html"
            echo "- **Specific deployment:** ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
