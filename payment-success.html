<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HarvestHome — Payment</title><style>body{font-family:system-ui;max-width:620px;margin:12vh auto;padding:24px}.box{padding:28px;border:1px solid #ddd;border-radius:18px}a{display:inline-block;padding:12px 18px;border-radius:10px;background:#14532d;color:#fff;text-decoration:none}</style></head><body><div class="box"><h1 id="title">Checking payment…</h1><p id="msg">Please wait while we verify your Paystack transaction.</p><a href="/">Return to HarvestHome</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="Config.js"></script><script>(async()=>{try{const sb=window.supabase.createClient(HARVESTHOME_CONFIG.SUPABASE_URL,HARVESTHOME_CONFIG.SUPABASE_ANON_KEY),p=new URLSearchParams(location.search),ref=p.get('reference')||p.get('trxref');const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Please sign in again to view payment status.');const r=await fetch(`${HARVESTHOME_CONFIG.SUPABASE_URL}/functions/v1/paystack-verify?reference=${encodeURIComponent(ref||'')}`,{headers:{Authorization:`Bearer ${session.access_token}`,apikey:HARVESTHOME_CONFIG.SUPABASE_ANON_KEY}});const j=await r.json();if(!r.ok)throw new Error(j.error||'Verification failed');if(j.status==='success'){title.textContent='Payment successful';msg.textContent='Your payment was verified successfully. Reference: '+j.reference}else{title.textContent='Payment not confirmed';msg.textContent='Payment status: '+(j.status||'unknown')}}catch(e){title.textContent='Verification unavailable';msg.textContent=e.message||'Please check your Paystack transaction.'}})()</script></body></html>
